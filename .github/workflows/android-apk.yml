name: Construir APK Android

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar también un Release de GitHub con la APK'
        type: boolean
        required: false
        default: false
      release_tag:
        description: 'Etiqueta del Release (por ejemplo v1.0.1)'
        type: string
        required: false
        default: 'v1.0.1'
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "No se encontró sdkmanager dentro de $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Construir APK de depuración
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: --no-daemon :app:assembleDebug
          build-root-directory: android
      - name: Publicar APK como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: Multirecorte-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK en Releases del repositorio
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release:')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            RELEASE_TAG="$(printf '%s\n' "$COMMIT_MESSAGE" | sed -nE 's/.*\[publish-release:([^]]+)\].*/\1/p' | head -n 1)"
          fi
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Falta la etiqueta del Release"
            exit 1
          fi
          gh release create "$RELEASE_TAG" android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Multirecorte $RELEASE_TAG" \
            --notes "APK Android de Multirecorte. Descarga app-debug.apk e instálala en Android 10 o posterior. Esta compilación es de depuración y no está firmada para Play Store. Los logs de diagnóstico se guardan en Descargas/Multirecorte."
